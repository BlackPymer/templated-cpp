name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang-format clang-tidy

      - name: clang-format
        run: find include src -name '*.hpp' -o -name '*.cpp' | xargs clang-format --dry-run -Werror

      - name: clang-tidy
        run: |
          find src -name '*.cpp' | xargs clang-tidy -p=. \
            --extra-arg=-std=c++17 --extra-arg=-Iinclude || true
